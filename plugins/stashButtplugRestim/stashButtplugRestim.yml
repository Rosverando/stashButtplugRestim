name: stashButtplugRestim
description: Connects StashApp to Buttplug.io/Intiface
version: 1.0
ui:
  javascript:
    - stashButtplugRestim.js
  csp:
    script-src:
      - https://cdn.jsdelivr.net
    connect-src:
      - ws://localhost:12346
      - ws://127.0.0.1:12346
      - ws://localhost:12345
      - ws://127.0.0.1:12345
      - ws://localhost
      - ws://127.0.0.1
      - "*"

settings:
  skipButtplug:
    type: BOOLEAN
    displayName: Direct Tcode
    description: Wether you want to skip Buttplug and send straight Tcode to Server URL
  serverUrl:
    type: STRING
    displayName: Server URL
    description: The address of your Intiface Central server (e.g. http://127.0.0.1:12345) (or restim if you want to skip buttplug, in which case the url should be something like ws://localhost:12346/tcode)
  latency:
    type: NUMBER
    displayName: Latency (ms)
    description: Adjust timing synchronization (negative to have actions play earlier)
  cumHotkey:
    type: BOOLEAN
    displayName: Cum Hotkey
    description: When pressing PAUSE on the keyboard, script playback will be stopped and a final command to got to <Cum Hotkey Position> in 0ms will be sent. To resume script playback, press PAUSE again.
  cumHotkeyPosition:
    type: NUMBER
    displayName:  Cum Hotkey Position
    description: The Position (0-100) the Device will go to when pressing the Cum Hotkey